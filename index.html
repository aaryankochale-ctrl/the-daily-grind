<!DOCTYPE html>
<html lang="en">
<head>
    <title>The Daily Grind - Coffee Shop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 4 CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <!-- We will put our custom CSS here later -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <!-- HEADER: Logo and Search/Tagline -->
    <header>
        <div class="container py-3">
            <div class="row align-items-center">
                <div class="col-12 col-md-6 text-center text-md-left">
                    <!-- Placeholder for Coffee Shop Logo -->
                    <h1 class="font-weight-bold text-success">☕ The Daily Grind</h1>
                </div>
                <div class="col-12 col-md-6 mt-3 mt-md-0">
                    <form class="form-inline justify-content-center justify-content-md-end">
                        <div class="input-group">
                            <input class="form-control mr-sm-2" type="text" placeholder="Search the menu...">
                            <button class="btn btn-success" type="submit">Search</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- NAVIGATION: Sticky dark bar -->
    <nav class="navbar navbar-expand-md bg-dark navbar-dark sticky-top">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link px-4" href="index.html">HOME</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#hot-drinks">HOT COFFEE</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#cold-drinks">ICED & BLENDED</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="#pastries">PASTRIES</a></li>
                    <li class="nav-item"><a class="nav-link px-4" href="contact.html">CONTACT</a></li>
                </ul>
            </div>  
        </div>
    </nav>

    <!-- MAIN CONTENT: Where our menu items will go -->
    <section class="container mt-5">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <h2 class="pb-2 border-bottom border-success d-inline-block">- Our Signature Menu -</h2>
                <p class="lead mt-3">Sourced locally, roasted freshly, and poured with love.</p>
            </div>
        </div>

        <!-- We will build our menu rows (like your Day 1, Day 2 boxes) right here -->

    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <p class="mb-0">© 2026 The Daily Grind Coffee Shop. All Rights Reserved.</p>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Bootstrap JS and jQuery (Required for the mobile navbar toggle to work) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
